name: CROUS Monitor

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * 1-5"
  workflow_dispatch:
    inputs:
      reset_state:
        description: "Set to true to clear seen IDs and resend current available listings once"
        required: false
        default: "false"
      force_email_window:
        description: "Set to true to bypass 08:00-18:00 and weekend restrictions for a manual test"
        required: false
        default: "false"
      require_email_success:
        description: "Set to true to fail the workflow if SMTP email sending fails"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: crous-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore previous state artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: crous-monitor.yml
          name: seen-state
          path: .
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Ensure valid state file
        run: |
          if [ ! -f seen_ids.json ]; then
            echo "{}" > seen_ids.json
          fi
          python - <<'PY'
          import json
          path = "seen_ids.json"
          default_state = {
              "seen_ids": [],
              "daily_date": "",
              "daily_ids": [],
              "daily_items": [],
              "last_summary_date": "",
          }
          try:
              with open(path, "r", encoding="utf-8") as f:
                  payload = json.load(f)
              if not isinstance(payload, (list, dict)):
                  raise ValueError("invalid state payload")
          except Exception:
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(default_state, f)
          PY

      - name: Run monitor once
        env:
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          RESEND_REPLY_TO: ${{ vars.RESEND_REPLY_TO }}
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ vars.RECIPIENT_EMAIL }}
          RESET_STATE: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_state || 'false' }}
          FORCE_EMAIL_WINDOW: ${{ github.event_name == 'workflow_dispatch' && inputs.force_email_window || 'false' }}
          REQUIRE_EMAIL_SUCCESS: ${{ github.event_name == 'workflow_dispatch' && inputs.require_email_success || 'false' }}
          RUN_ONCE: "true"
        run: python main.py

      - name: Upload updated state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seen-state
          path: seen_ids.json
          retention-days: 90
          overwrite: true
